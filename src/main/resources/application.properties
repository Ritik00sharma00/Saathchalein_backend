spring.application.name=saathchalein_backend
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8081}

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=${DB_NAME:TestDb};encrypt=true;trustServerCertificate=true;loginTimeout=30
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

jwt.secret=${JWT_SECRET:change-me-to-a-very-long-random-secret}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

server.error.include-message=always
